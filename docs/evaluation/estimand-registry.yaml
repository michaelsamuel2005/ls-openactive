# ---------------------------------------------------------------------
# 10. DECLARED OUT OF SCOPE (19 August 2026)
# ---------------------------------------------------------------------
# These were within the proposal's stated ambition and are NOT delivered.
# Each is recorded as a dated scope decision with its reason, so that the
# absence is a declared limitation rather than an undisclosed gap.
# Declared by Fahmi Alshahabi (evaluation stream). Ratification may revisit
# any of them; until then they are out of scope and no claim depends on them.
declared_out_of_scope:

  F-10_hierarchical_bayesian:
    declared: 2026-08-19
    scope: >
      The hierarchical Bayesian secondary analysis is not executed. No
      hierarchical posterior, prior sensitivity, simulation-based
      calibration, posterior predictive check or convergence diagnostic
      is reported.
    reason: >
      Locked Section 2 makes the design-weighted finite-benchmark analysis
      the primary decision instrument. The analysis-primacy conflict raised
      as CA-01.A8 — Packet 11's D23 proposed the hierarchical posterior as
      the decision instrument instead — was never resolved by the team, and
      the readiness conditions for the secondary layer were not met before
      freeze. Executing an unratified secondary instrument would create two
      competing analyses with no agreed precedence.
    consequence: >
      No partial-pooling, shrinkage or borrowing-of-strength claim is made.
      All reported quantities come from the design-weighted analysis.
    reading_released: [R-09, R-10, R-11, R-14]

  F-12_equity_analysis:
    declared: 2026-08-19
    scope: >
      Equity-relevant quantitative analysis is not executed. No subgroup,
      deprivation-linked or distributional fairness quantity is reported.
    reason: >
      Section 22 already prohibits demographic-fairness claims for this
      design. No approved ethics route exists for participant-level data,
      and IMD and scenario data do not identify people, so any output would
      be descriptive of areas rather than of groups and could not support
      the claim the analysis exists to make.
    consequence: >
      No fairness, equity or distributional-impact claim is made at any
      level. Area-level descriptive context, if reported at all, is labelled
      as such and carries no fairness interpretation.

  F-14_recommender_review:
    declared: 2026-08-19
    scope: >
      The independent non-author review of the production recommender is
      not delivered.
    reason: >
      No recommender was built. The acquisition stream delivered harvest
      and snapshot functionality only; there is no production EVOI
      recommender artefact to review. Confirmed by Michael on 2026-08-29:
      no recommender exists in any branch, so no superiority comparator is
      available and the evaluation is an evidence-communication comparison
      across presentation conditions plus a baseline.
    consequence: >
      No claim is made about recommender quality, calibration or behaviour.
      The evaluation-side recommender estimands remain defined but unused.

