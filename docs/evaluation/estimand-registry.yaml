#   by CA-01 Part 3.4. Becomes reviewable for freeze only after the
#   CA-01 amendments land in the canonical protocols and RATIFY-19-04
#   passes. Every numeric threshold below is deliberately RATIFY:
#   "none may be invented for apparent completeness" (work package,
#   status notice).
# Path note: docs/evaluation/ is the §17 candidate layout, pending
#   architecture ratification with Wesley.
# Authorship notice: AI-assisted coordination scaffold. Not evidence
#   that Fahmi authored, read, accepted or completed the work. Fahmi
#   must inspect and correct it in his own words and obtain scoped
#   non-author review (F-02 reviewer: Michael).
