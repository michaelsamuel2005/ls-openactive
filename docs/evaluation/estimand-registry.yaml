meta:
  registry_id: F-02
  depends_on_amendments: [CA-01.A1, CA-01.A2, CA-01.A5, CA-01.A6, CA-01.A8, F-BLOCK-09]
  reviewer: michael
  machine_readable: true
  units_vocabulary: [task, episode, response, candidate]
  primary_unit_rule: >
    The primary unit is the task (or the episode for dialogue outcomes).
    Nested candidates, claims and turns are never treated as independent
    tasks unless an estimand explicitly declares them the primary unit.

# ---------------------------------------------------------------------
# 1. CORE ESTIMANDS (frozen vocabulary per CA-01.A1)
# ---------------------------------------------------------------------
estimands:

  K:
    name: selection_emission_coverage
    definition: >
      Proportion of tasks in the declared universe receiving a
      substantive decision or response (i.e., not abstained/refused),
      under the frozen design weights.
    unit: task
    numerator: tasks_with_substantive_emission
    denominator: intention_to_evaluate_task_universe
    weights:
      design_weights_v: RATIFY
    permitted_claims: [coverage_within_declared_universe]
    prohibited_claims: [population_coverage, londoner_behaviour, between_arm_difference]
    invariance: >
      INVARIANT BY CONSTRUCTION (2026-08-29). Arms share one terminal
      DecisionEnvelope, so emission is identical across arms. Reported once
      as a system property; never a between-arm contrast.
    source: [work_package_10.1, CA-01.A1]

  U:
    name: useful_supported_decision_coverage
    definition: >
      The proportion of tasks with a supported decision that receive an
      assessor-judged useful label, where the denominator is fixed across
      arms by the shared DecisionEnvelope and only the usefulness judgment
      varies; U is communication-side, while K carries emission coverage.
    unit: task
    role: H-P_primary_endpoint   # single primary under the 2026-08-29 restatement
    requires_human_judgment: [usefulness]   # soft_relevance removed: Q is no longer an H-P conjunct
    gold_source: independent_reference_route   # never the treatment verifier
    analysis_label: adjudicated_label_per_template_arm   # A5(a); Michael arbitrates
    weights:
      design_weights_v: RATIFY
    superiority_margin: RATIFY   # design-derived last-resort bound; partner trigger of 26 Aug 2026 passed unanswered. Value from F-06. NOT a pass threshold - see §6.
    source: [work_package_10.1, CA-01.A1]

  Q:
    name: ranking_utility
    definition: >
      Graded ranking relevance at frozen depth on the emitted slate;
      judged episode-level by independent assessors, never supplied by
      the production ranker. Distinct symbol — U is never reused for
      ranking (CA-01.A1).
    unit: task
    metric_family: nDCG_or_equivalent   # exact metric: RATIFY
    depth: RATIFY   # first-screen display depth - pending Clarence
    non_inferiority_margin: RATIFY
    status_2026_08_29: >
      HELD, pending Clarence's definitions of P0/P1/P2. If the conditions are
      identical in ordering and display depth, Q is invariant by construction
      and demotes alongside K. If they differ, Q is a secondary estimative
      outcome and is not an H-P conjunct either way.
    inferential_status: estimative_or_invariant_pending_clarence
    source: [work_package_10.1, integrated_proposal_s3]

  R_evidence:
    name: conditional_evidence_false_assurance_risk
    definition: >
      Among emitted decisions, the design-weighted probability of an
      L_evidence event.
    unit: task
    conditioning: emitted_only
    loss: L_evidence
    source: [work_package_10.1]

  R_decision:
    name: conditional_whole_decision_risk
    definition: >
      Among emitted decisions, the design-weighted probability of an
      L_decision event. The H-P risk-gate quantity (CA-01.A2).
    unit: task
    conditioning: emitted_only
    loss: L_decision
    risk_ceiling: RATIFY   # public false-assurance/harm trade-off — Fahmi cannot decide alone (work package §19)
    invariance: >
      INVARIANT BY CONSTRUCTION (2026-08-29). Identical terminal decisions
      across arms. Retained as an ABSOLUTE certification of the single
      certified engine against the ratified ceiling; never a between-arm
      contrast, and no longer an H-P conjunct.
    source: [work_package_10.1, CA-01.A2]

  H_evidence:
    name: unconditional_harmful_emission_probability_evidence
    definition: >
      Over all tasks (emitted or not), probability of an emitted
      L_evidence event. COMPUTED DIRECTLY; the identity H = K x R is a
      reconciliation check only where universes, inclusion rules and
      weights are identical (CA-01.A5).
    unit: task
    computed_directly: true
    source: [work_package_10.1, CA-01.A5]

  H_decision:
    name: unconditional_harmful_emission_probability_decision
    definition: "same_as_H_evidence_with_loss: L_decision"
    unit: task
    computed_directly: true
    invariance: >
      INVARIANT BY CONSTRUCTION (2026-08-29). Reported once; never a
      between-arm contrast.
    source: [work_package_10.1, CA-01.A5]

# ---------------------------------------------------------------------
# 2. LOSSES (CA-01.A2)
# ---------------------------------------------------------------------
losses:
  L_evidence:
    definition: >
      Unsupported catalogue assertion; unsupported mandatory
      implication; or unjustified bounded non-match.
    used_by: [H-G, R_evidence, H_evidence]
  L_decision:
    definition: >
      L_evidence OR the independently frozen unacceptable-decision
      condition.
    unacceptable_decision_condition: RATIFY   # must be frozen from partner/workflow meaning, never invented here
    used_by: [H-P, R_decision, H_decision]
  L_reliance:
    layer: application_only
    definition: >
      Reliance loss occurs when a user's action is unjustified given the
      terminal DecisionEnvelope evidence state, evaluated against the shared
      terminal referent rather than the system emission itself. Failure
      condition: the user acts as though a supported match exists when the
      terminal state is evidence_indeterminate or bounded_non_match.
      Under-reliance is deliberately out of scope - declining to act on a
      supported_match is not evidence of error, since a user may decline for
      reasons unrelated to evidence. Judged against the terminal state only,
      never against what the condition displayed.
    referent: terminal_decision_envelope_evidence_state
    referent_source: [C-BLOCK-05_section_6, C-BLOCK-15, F-BLOCK-09]
    used_by: []
    never_enters: [H-P, H-E, H-G, CAL-RISK, risk_control_of_any_kind]
    inferential_status: estimative
    requires_ethics_route: true
    unmeasured_without_ethics: true
  reporting_rule: components_always_reported_separately

# ---------------------------------------------------------------------
# 3. SECONDARY / COMPONENT OUTCOMES
# ---------------------------------------------------------------------
secondary_outcomes:

  false_suppression:
    definition: >
      Task-level: an evidence-supported useful option existed under the
      independent reference route but the system suppressed or refused.
    unit: task
    disjoint_with: over_refusal
    gold_source: independent_reference_route

  over_refusal:
    definition: >
      Task-level: abstention/refusal where emission was permitted and
      safe under the frozen rules.
    unit: task

  correct_abstention:
    definition: >
      Abstention where no evidence-supported emission was permitted.
    unit: task

  supported_fact_completeness:
    definition: >
      Of the finite eligible fact set the evidence could support for the
      task, the proportion delivered in the rendered response.
    unit: response
    requires_human_judgment: true
    role: H-G_non_inferiority_component
    non_inferiority_margin: RATIFY

  integrated_regret:
    symbol: IReg
    definition: >
      Preference loss over turns versus the theta_true-optimal permitted
      slate, integrated over the episode; evidence-permitted regret.
    unit: episode
    evaluation: simulation_first   # gold typed intents + controlled simulated preference states
    improvement_margin: RATIFY

  wasted_questions:
    symbol: W
    definition: >
      Questions whose every possible answer changes no permitted slate
      or gate partition; decomposed by cause into preference_side and
      observability_side.
    unit: episode
    conditioning: questions_asked
    improvement_margin: RATIFY

  state_transitions:
    definition: >
      S0->S1->S1b task-decision transition matrix (weighted); partial
      identification bounds retained, never collapsed to points.
    unit: task
    inferential_status: estimative

# ---------------------------------------------------------------------
# 3b. APPLICATION-LAYER OUTCOMES (F-BLOCK-09; estimative, never confirmatory)
# ---------------------------------------------------------------------
application_outcomes:

  reliance_loss_rate:
    loss: L_reliance
    unit: episode
    conditioning: unrepaired_episodes_only
    excluded: query_repaired_episodes
    repair_screen:
      stage_1_mechanical: >
        Opening-query envelope digest != terminal envelope digest
        -> classified repaired, no human judgment.
        DEPENDS ON: opening-query digest field in event-schema.json,
        which does not yet exist. Raised with Clarence for the
        C-BLOCK-05 contract workshop.
      stage_2_adjudicated: >
        Digest-equal residual only, judged blind to and before the
        reliance outcome, on whether the interpreted query changed.
      blinding_and_order: >
        Repair status adjudicated and frozen before reliance adjudication;
        assessors blind to the reliance outcome.
      screen_audit: >
        No. The deterministic repair screen is not independently re-audited
        in the current protocol; recorded as a declared design decision.
        No screen error rate is reportable.
    exclusion_rule_declared: pre_declared_never_outcome_dependent
    contrasts: [P1_vs_P0, P2_vs_P1, W1_vs_W0, W1_vs_W1-NA]
    inferential_status: estimative
    requires_human_judgment: true
    weights:
      design_weights_v: RATIFY
    permitted_claims: >
      Reliance loss rate over unrepaired episodes within the declared task
      universe, at the stated acquisition vintage, under the frozen design
      weights. Between-condition contrasts are estimative and conditional on
      the shared terminal DecisionEnvelope referent. No claim extends beyond
      the episodes adjudicated in this benchmark.
    prohibited_claims:
      - no_human_effectiveness_claim_absent_ethics
      - no_deployment_or_organisational_effectiveness_claim
      - no_inference_about_attendance_or_health_outcomes
      - no_demographic_fairness_claim
      - no_confirmatory_wording
      - no_safer_by_displaying_less_claim

  query_repair_rate:
    definition: >
      Proportion of P2 episodes classified repaired, reported with
      uncertainty; declares the inference boundary created by the exclusion.
    unit: episode
    inferential_status: estimative
    reported_always: true

# ---------------------------------------------------------------------
# 4. ABSTENTION MECHANISMS (closed enum; CA-01.A6)
# ---------------------------------------------------------------------
abstention_mechanisms:
  - evidence_required
  - model_uncertainty
  - policy_safety
  - adversarial_containment_retrieval_jamming
  - collection_scope_limitation
  - service_failure
reporting_rule: >
  Mechanisms are disjoint in reporting; induced refusal under attack is
  never scored as safe abstention.

# ---------------------------------------------------------------------
# 5. SYSTEM FAILURE CODES (typed; intention-to-evaluate)
# ---------------------------------------------------------------------
failure_codes:
  - timeout
  - crash
  - malformed_output
rules:
  - every_assigned_locked_task_stays_in_its_denominator
  - failures_are_typed_system_failures_not_missing_at_random
  - no_outcome_dependent_complete_case_deletion
  - zero_failures_in_both_arms_never_establish_superiority_or_zero_risk

# ---------------------------------------------------------------------
# 6. CONFIRMATORY DECISION RULES
# ---------------------------------------------------------------------
decisions:

  # ===================================================================
  # ===================================================================
  H-P:
    status: sole_unconditional_confirmatory
    restated: 2026-08-29
    analysis_primacy: design_based_paired_design_weighted   # per locked Section 2; PENDING CA-01.A8 team ratification; Packet 11 D23 conflicts
    primary_endpoint: >
      The primary endpoint is binary usefulness, assessor-judged under
      F-05 §2, recorded as an adjudicated label with one label per
      template-arm.
    primary_contrast: >
      The primary contrast is [PENDING CLARENCE] versus P0, with the
      designation fixed in a dated record before outcome inspection.
    designated_arm: PENDING-CLARENCE
    decision_rule: >
      A one-sided test of H0: the paired within-template usefulness
      difference is at or below zero, at alpha = 0.05. q counts
      templates, not task rows.
    delta_role: >
      δ comes from F-06 and is the effect detected at 0.80 power.
      It is reported alongside the result and is not a pass condition,
      because gating on it would halve power against δ itself.
    not_conjuncts: [Q_non_inferiority, L_decision_risk_gate]
    superseded_2026_08_29:
      - U_superiority_over_strongest_eligible_baseline   # "strongest eligible" void: comparator is designated, not selected
      - Q_non_inferiority                                # Q invariant or estimative; pending Clarence
      - L_decision_risk_gate                             # invariant by construction; now absolute certification
    comparator_selection: designated_before_outcome_inspection   # was DEV_only_strongest_eligible
    limitations:
      - blinding_impossible_by_construction   # arms differ only in presentation; the presentation is the label
      - arm_author_assessor_conflict_open     # Clarence authors P0/P1/P2 and assesses all three constructs; C6 at risk if recused

  H-E:
    status: readiness_gated
    gates: [posterior_correctness, oracle_checks, policy_parity]
    conjuncts:
      - IReg_improvement: {margin: RATIFY}
      - wasted_question_improvement: {margin: RATIFY}
      - non_harm_vs_system_risk_ceiling: true

  H-G1:
    status: readiness_gated
    conjuncts:
      - L_evidence_improvement_vs_strongest_of_A1_A2: {margin: RATIFY}
      - supported_fact_completeness_non_inferiority: {margin: RATIFY}
  H-G2:
    status: readiness_gated_descriptive_contrast
    contrast: A3_vs_A0
    reported: [assurance, quality, latency, coverage, abstention_cost]

  gate_failure_rule: >
    A failed readiness gate permits estimative reporting only;
    confirmatory wording prohibited. H-E/H-G cannot rescue a failed H-P.

# ---------------------------------------------------------------------
# 7. CONDITION REGISTRIES (pointers; owned elsewhere, frozen with them)
# ---------------------------------------------------------------------
conditions:
  recommender: [B0, B1, B2, B3_offline_only, B4, B5]
  generation: [A0, A1, A2, A3]
  applications_public: [P0, P1, P2]
  applications_staff: [W0, W1, W1-NA]
  elicitation: DISCREPANCY   # see discrepancy log D-1

# ---------------------------------------------------------------------
# 8. DISCREPANCY LOG (found while drafting; take to ratification)
# ---------------------------------------------------------------------
discrepancies:
  D-1:
    where: elicitation_conditions
    detail: >
      Work package §4.4 lists SIX elicitation conditions (no question,
      fixed order, random eligible, uncertainty-only, conventional EVOI,
      observability-aware EVOI). The integrated proposal's Section 8
      table lists FIVE (E0-E4, no "random eligible"). The condition set
      must be frozen to one list before the sizing simulation, since arm
      count drives assessor effort.
    disposition: RATIFY
  D-2:
    where: ranking_utility_metric
    detail: >
      "nDCG at frozen depth" appears as an example, not a decision.
      Exact metric and depth are RATIFY before codebook pilot, since
      judgment collection depends on them.
    disposition: RATIFY

